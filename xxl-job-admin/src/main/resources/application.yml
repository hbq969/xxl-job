              </linearGradient>
            </defs>
            <rect class="bg-base" width="800" height="900"/>
            <!-- 外圈装饰环 -->
            <circle class="ring" cx="400" cy="450" r="360" fill="none" stroke="url(#g1)" stroke-width="0.5" opacity="0.18"/>
            <circle class="ring" cx="400" cy="450" r="340" fill="none" stroke="url(#g2)" stroke-width="0.5" opacity="0.14"/>
