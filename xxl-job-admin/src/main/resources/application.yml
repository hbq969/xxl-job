### web
server:
  port: 30635
  servlet:
    context-path: /xxl-job-admin
    session:
      cookie:
        http-only: true
        max-age: ${spring.mvc.interceptors.login.cookie-max-age-sec}
        secure: false
        same-site: strict
        path: /
        name: xxl-job-admin-sid
      timeout: 30m

### actuator
management:
  endpoints:
    web:
      base-path: /actuator
  health:
    mail:
      enabled: false

### resources
spring:
  application:
    name: xxl-job-admin
  main:
    allow-bean-definition-overriding: true
  messages:
    basename: i18n/messages
    encoding: UTF-8
    enabled: true
  mvc:
    servlet:
      load-on-startup: 0
    static-path-pattern: /static/**
    interceptors:
      mdc:
        enabled: true
      resource-handler-registry:
        entries:
          - handlers: /hbq969-common/**
            locations: classpath:/static/hbq969-common/
          - handlers: /hbq969-dict/**
            locations: classpath:/static/hbq969-dict/
          - handlers: /hbq969-tabula/**
            locations: classpath:/static/hbq969-tabula/
          - handlers: /${spring.mvc.interceptors.login.ui-output-dir}/**
            locations: classpath:/static/${spring.mvc.interceptors.login.ui-output-dir}/
          - handlers: /xxl-job-ui/**
            locations: classpath:/static/xxl-job-ui/
          - handlers: /**
            locations:
              - classpath:/static/
              - classpath:/
        enabled: true
      login:
        enabled: true
        cookie-max-age-sec: 1800
        include-urls:
          - "/**"
        exclude-urls:
          - "/**/*.js"
          - "/**/*.css"
          - "/**/*.png"
          - "/**/*.jpg"
          - "/**/*.map"
          - "/**/*.ico"
          - "/**/error"
          - "/**/error"
          - "/common/health"
          - "/${spring.mvc.interceptors.login.ui-output-dir}/index.html"
          - "/${spring.mvc.interceptors.login.ui-output-dir}/**/login"
          - "/${spring.mvc.interceptors.login.ui-output-dir}/i18n/lang"
          - "/${spring.mvc.interceptors.login.ui-output-dir}/i18n/lang/data"
          - "/${spring.mvc.interceptors.login.ui-output-dir}/**/getPublicKey"
        session-key: xxl-job-admin-sid
        sm-initial-script:
          language: zh-CN
          charset: utf-8
        menu:
          prefix: ""
        auth:
          base:
            enabled: true
        main-layout: main_left
        group-menu-size: 5
        copyright: ""
        ui-output-dir: ui
        home-url: inner:/xxl-job-admin/xxl-job-ui/index.html#/task/list
        favicon-path: /xxl-job-admin/ui/favicon.ico
        login-page-svg: |
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" preserveAspectRatio="xMidYMid slice">
            <defs>
