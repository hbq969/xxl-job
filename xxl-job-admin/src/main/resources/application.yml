### xxl-job
xxl:
  job:
    accessToken: 0CF7D9D21B7C4BA7
    timeout: 3
    i18n: zh_CN
    triggerpool:
      fast:
        max: 200
      slow:
        max: 100
    logretentiondays: 30
  sso:
    token:
      key: xxl_job_login_token
      timeout: 604800000
    client:
      excluded:
        paths: ""
      login:
        path: /auth/login

xxl-sso:
  token:
    key: xxl_job_login_token
    timeout: 604800000
  client:
    excluded:
      paths: ""
    login:
      path: /auth/login

advice:
  log:
    enabled: false
  ex:
    enabled: true
