spring:
  mvc:
    interceptors:
      login:
        enabled: true
        session-key: xxl-job-admin-sid
        sm-initial-script:
          language: zh-CN
          charset: utf-8
        menu:
          prefix: ""
        auth:
          base:
            enabled: true
          sso:
            enabled: true
            sso-url: http://docker.for.mac.host.internal:30630/aqyy-portal-login
            cookie-token-name: aqyy-portal-login-sid
        main-layout: main_left
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    dynamic:
      enabled: true
      base-packages: com.github.hbq969,com.xxl.job
      default-lookup-key: hikari
    hikari:
      jdbc-url: jdbc:postgresql://localhost:5432/xxl_job
      driver-class-name: org.postgresql.Driver
      username: admin
      password: 123456
      maximum-pool-size: 10
      minimum-idle: 2
      max-lifetime: 1800000
      connection-test-query: SELECT 1

### mybatis
mybatis:
  mapper-locations:
    - classpath*:mapper/*Mapper.xml
    - classpath*:mapper/postgresql/*Mapper.xml
    - classpath*:com/github/hbq969/code/**/mapper/common/*Mapper.xml
    - classpath*:com/github/hbq969/code/**/mapper/postgresql/*Mapper.xml
  config-location: classpath:jpaConfig-postgresql.xml

eureka:
  instance:
    instance-id: ${eureka.instance.ip-address}:${server.port}
    ip-address: ${spring.cloud.client.ip-address}
    prefer-ip-address: true
  client:
    serviceUrl:
      defaultZone: http://docker.for.mac.host.internal:30620/eureka/
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 10
    enabled: true

swagger:
  base-package: com
  api-info:
    title: xxl-job Restful API
    description: xxl-job Restful API
    termsOfService: http://127.0.0.1:${server.port}

dict:
  enabled: true
  reload:
    cron: 0 */30 * * * *
  map-key-prefix: fmt

encrypt:
  config:
    enabled: true
  restful:
    enabled: true
    aes:
      charset: utf-8
      show-log: true
      key: E793C71D5EAB4385
      iv: 8AE506C91AFB4AAC
    rsa:
      charset: utf-8
      show-log: true
      public-key: MIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQCe7L2gjYAmFCW8Q8S5kW7F064t/np+sP84PKLRsuZho3TZIjryGSyq8reNTm2Zrz0pKzddR0Rh6wUzP9xSAsQXH0uC6J5/WbmFhFW0k8zgkXSKktirs2BDuObEYZwJLng41yhP694H9sVBVhyqzy90Qx/dJWWa2vXHp2I+jlLELQIDAQAB
